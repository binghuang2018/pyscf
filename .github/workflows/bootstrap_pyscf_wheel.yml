name: Bootstrap official PySCF wheels

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official distributions
        run: |
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: --no-deps pyscf==2.14.0 -d wheelhouse
          python -m pip download --no-deps geometric==1.1.1 -d wheelhouse
          sha256sum wheelhouse/* > wheelhouse/SHA256SUMS
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: official-pyscf-geometric-distributions
          path: wheelhouse
          retention-days: 1

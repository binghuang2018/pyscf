name: ChatGPT H_AB MINAO validation (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/hab-minao-validation-20260825
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install numerical stack and PySCF
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.4' scipy pandas tabulate pyscf==2.14.0
      - name: Run serial RHF/MINAO validation
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: |
          rm -rf chatgpt_hab_validation/results
          python chatgpt_hab_validation/run_validation_fast.py --basis minao --output chatgpt_hab_validation/results

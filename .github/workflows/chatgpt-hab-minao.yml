name: ChatGPT H_AB MINAO validation

on:
  push:
    branches:
      - chatgpt/hab-minao-validation-20260825
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-hab-minao-validation-fast
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/hab-minao-validation-20260825

      - name: Mark fast run as started
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'fast-started %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > chatgpt_hab_validation/ci_status.txt
          git add chatgpt_hab_validation/ci_status.txt
          git commit -m 'Mark fast MINAO validation started [skip ci]' || true
          git push origin HEAD:chatgpt/hab-minao-validation-20260825

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install numerical stack and PySCF
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.4' scipy pandas tabulate pyscf==2.14.0

      - name: Run fast RHF/MINAO validation
        id: calculation
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: |
          rm -rf chatgpt_hab_validation/results
          mkdir -p chatgpt_hab_validation/results
          set +e
          python chatgpt_hab_validation/run_validation_fast.py --basis minao --output chatgpt_hab_validation/results 2>&1 | tee chatgpt_hab_validation/results/workflow.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record status
        if: always()
        run: |
          if [ "${{ steps.calculation.outputs.exit_code }}" = "0" ]; then
            printf 'completed %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > chatgpt_hab_validation/ci_status.txt
          else
            printf 'failed exit_code=%s %s\n' "${{ steps.calculation.outputs.exit_code }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > chatgpt_hab_validation/ci_status.txt
          fi

      - name: Upload numerical results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hab-minao-validation-results
          path: chatgpt_hab_validation/results
          if-no-files-found: warn
          retention-days: 30

      - name: Commit results to isolated branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt_hab_validation/results chatgpt_hab_validation/ci_status.txt
          git commit -m 'Store fast MINAO validation results [skip ci]' || exit 0
          git pull --rebase origin chatgpt/hab-minao-validation-20260825
          git push origin HEAD:chatgpt/hab-minao-validation-20260825

      - name: Propagate calculation failure
        if: steps.calculation.outputs.exit_code != '0'
        run: exit 1

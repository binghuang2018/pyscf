name: ChatGPT H_AB MINAO validation

on:
  push:
    branches:
      - chatgpt/hab-minao-validation-20260825
    paths:
      - .github/workflows/chatgpt-hab-minao.yml
      - chatgpt_hab_validation/run_validation_fast.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out isolated validation branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/hab-minao-validation-20260825

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install numerical stack and PySCF
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.4' scipy pandas tabulate pyscf==2.14.0

      - name: Run all 15 RHF/MINAO diatomics
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: |
          rm -rf chatgpt_hab_validation/results
          python chatgpt_hab_validation/run_validation_fast.py \
            --basis minao \
            --output chatgpt_hab_validation/results

      - name: Print technical report
        if: always()
        run: |
          if test -f chatgpt_hab_validation/results/report.md; then
            cat chatgpt_hab_validation/results/report.md
          fi

      - name: Upload complete numerical output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hab-minao-validation
          path: chatgpt_hab_validation/results
          if-no-files-found: warn

      - name: Commit successful results to isolated branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt_hab_validation/results
          git commit -m 'Add PySCF/MINAO H_AB validation results' || exit 0
          git push origin HEAD:chatgpt/hab-minao-validation-20260825

name: ChatGPT H_AB MINAO validation

on:
  push:
    branches:
      - chatgpt/hab-minao-validation-20260825
    paths:
      - chatgpt_hab_validation/run_validation.py
      - .github/workflows/chatgpt-hab-minao.yml

permissions:
  contents: write

concurrency:
  group: chatgpt-hab-minao-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/hab-minao-validation-20260825

      - name: Mark run as started
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p chatgpt_hab_validation
          printf 'started %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > chatgpt_hab_validation/ci_status.txt
          git add chatgpt_hab_validation/ci_status.txt
          git commit -m 'Mark MINAO validation as started [skip ci]' || true
          git push origin HEAD:chatgpt/hab-minao-validation-20260825

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install numerical stack and PySCF
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.4' scipy pandas tabulate pyscf==2.14.0

      - name: Run RHF/MINAO validation
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: |
          rm -rf chatgpt_hab_validation/results
          python chatgpt_hab_validation/run_validation.py --basis minao --output chatgpt_hab_validation/results

      - name: Upload numerical results
        uses: actions/upload-artifact@v4
        with:
          name: hab-minao-validation-results
          path: chatgpt_hab_validation/results
          if-no-files-found: error
          retention-days: 30

      - name: Commit results to isolated branch
        run: |
          printf 'completed %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > chatgpt_hab_validation/ci_status.txt
          git add chatgpt_hab_validation/results chatgpt_hab_validation/ci_status.txt
          git commit -m 'Store MINAO validation results [skip ci]' || exit 0
          git push origin HEAD:chatgpt/hab-minao-validation-20260825
